services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: miaodong
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miaodong"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3 兼容的测试替身（MinIO 官方镜像已停止分发）。
  # 生产可使用任意 S3 兼容对象存储；本地/CI 用 S3Mock 验证 presign 链路。
  # 容器内 9090，映射到宿主 9000，保持 MIAODONG_MINIO_ENDPOINT 默认值不变。
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: miaodong-audio
    ports:
      - "9000:9090"
      - "9001:9191"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

